services:
  traefik:
    image: traefik:v2.10
    container_name: traefik
    restart: always
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.web.http.redirections.entryPoint.to=websecure"
      - "--entrypoints.web.http.redirections.entryPoint.scheme=https"
      - "--certificatesresolvers.myresolver.acme.httpchallenge=true"
      - "--certificatesresolvers.myresolver.acme.httpchallenge.entrypoint=web"
      - "--certificatesresolvers.myresolver.acme.email=seu-email@exemplo.com" # <- Seu e-mail real
      - "--certificatesresolvers.myresolver.acme.storage=/letsencrypt/acme.json"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - "./letsencrypt:/letsencrypt"
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
    networks:
      - web

  php:
    container_name: symfony_php_homepet1
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    environment:
      APP_ENV: prod
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.symfony.rule=Host(`seu-dominio.com`) || Host(`://seu-dominio.com`)" # <- Seu domínio real
      - "traefik.http.routers.symfony.entrypoints=websecure"
      - "traefik.http.routers.symfony.tls=true"
      - "traefik.http.routers.symfony.tls.certresolver=myresolver"
      - "traefik.http.services.symfony.loadbalancer.server.port=80"
    networks:
      - web
    build:
      context: .
      dockerfile: Dockerfile

networks:
  web:
    name: web
