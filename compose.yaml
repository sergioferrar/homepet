services:
  app:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: symfony_php_homepet
    volumes:
      - ./:/var/www/html
    ports:
      - '80:80'
      - '443:443'
    environment:
      APP_ENV: prod
    restart: unless-stopped
    networks:
      - proxy_network

networks:
  proxy_network:
    driver: bridge
