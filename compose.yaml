services:
  traefik:
    image: traefik:v3.0
    container_name: traefik
    restart: unless-stopped

    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--certificatesresolvers.letsencrypt.acme.email=SEU_EMAIL"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web"

    ports:
      - "80:80"
      - "443:443"

    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      - "./letsencrypt:/letsencrypt"

    networks:
      - proxy

  php:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: symfony_php_homepet
    working_dir: /var/www/html

    volumes:
      - ./:/var/www/html

    environment:
      APP_ENV: prod

    restart: unless-stopped
    command:
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
    labels:
      - "traefik.http.routers.systemhomepet.rule=Host(`systemhomepet.com`,`www.systemhomepet.com`)"
      - "traefik.http.routers.systemhomepet.entrypoints=websecure"
      - "traefik.http.routers.systemhomepet.tls=true"
      - "traefik.http.routers.systemhomepet.tls.certresolver=letsencrypt"
      - "traefik.http.services.systemhomepet.loadbalancer.server.port=80"

    networks:
      - proxy
    expose:
      - "80"
      - "443"

networks:
  proxy:
    name: proxy