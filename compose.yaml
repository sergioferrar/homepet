services:
  php:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: symfony_php_homepet
    working_dir: /var/www/html

    ports:
      - "80:80"
      - "443:443"

    volumes:
      - ./:/var/www/html

    environment:
      APP_ENV: prod

    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.systemhomepet.rule=Host(`systemhomepet.com`,`www.systemhomepet.com`)"
      - "traefik.http.routers.systemhomepet.entrypoints=websecure"
      - "traefik.http.routers.systemhomepet.tls=true"
      - "traefik.http.routers.systemhomepet.tls.certresolver=letsencrypt"
      - "traefik.http.services.systemhomepet.loadbalancer.server.port=8080"