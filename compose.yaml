services:
  traefik:
    image: traefik:v2.10
    container_name: traefik
    restart: always
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      # Redirecionamento automático de HTTP (80) para HTTPS (443) global no Traefik
      - "--entrypoints.web.http.redirections.entryPoint.to=websecure"
      - "--entrypoints.web.http.redirections.entryPoint.scheme=https"
      # Configuração do ACME (Certbot integrado do Traefik)
      - "--certificatesresolvers.myresolver.acme.httpchallenge=true"
      - "--certificatesresolvers.myresolver.acme.httpchallenge.entrypoint=web"
      - "--certificatesresolvers.myresolver.acme.email=seu-email@exemplo.com" # <- Mude para seu e-mail
      - "--certificatesresolvers.myresolver.acme.storage=/letsencrypt/acme.json"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - "./letsencrypt:/letsencrypt"
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
    networks:
      - web

  php:
    image: php:8.3-apache
    container_name: symfony_php_homepet
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    environment:
      APP_ENV: prod
    restart: unless-stopped
    # Roteamento do Traefik para este contêiner
    labels:
      - "traefik.enable=true"
      # Mude para o seu domínio real abaixo:
      - "traefik.http.routers.symfony.rule=Host(`seu-dominio.com`) || Host(`://seu-dominio.com`)"
      - "traefik.http.routers.symfony.entrypoints=websecure"
      - "traefik.http.routers.symfony.tls=true"
      - "traefik.http.routers.symfony.tls.certresolver=myresolver"
      # Indica ao Traefik que o Apache interno escuta na porta 80
      - "traefik.http.services.symfony.loadbalancer.server.port=80"
    networks:
      - web
    build:
      context: .
      dockerfile_inline: |
        FROM php:8.3-apache

        RUN apt-get update && apt-get install -y \
            git \
            unzip \
            curl \
            libicu-dev \
            libzip-dev \
            libpng-dev \
            libjpeg62-turbo-dev \
            libfreetype6-dev \
            && docker-php-ext-configure gd \
                --with-freetype \
                --with-jpeg \
            && docker-php-ext-install -j\$(nproc) \
                pdo_mysql \
                intl \
                zip \
                opcache \
                gd \
            && a2enmod rewrite headers \
            && apt-get clean \
            rm -rf /var/lib/apt/lists/*

        COPY --from=composer:2 /usr/bin/composer /usr/bin/composer

        # O Apache volta a ser simples: apenas escuta na porta 80 interna do container
        RUN printf '%s\n' \
            '<VirtualHost *:80>' \
            '    DocumentRoot /var/www/html/public' \
            '    <Directory /var/www/html/public>' \
            '        AllowOverride All' \
            '        Require all granted' \
            '        Options FollowSymLinks' \
            '        DirectoryIndex index.php' \
            '    </Directory>' \
            '    ErrorLog \${APACHE_LOG_DIR}/error.log' \
            '    CustomLog \${APACHE_LOG_DIR}/access.log combined' \
            '</VirtualHost>' \
            > /etc/apache2/sites-available/000-default.conf

networks:
  web:
    name: web
